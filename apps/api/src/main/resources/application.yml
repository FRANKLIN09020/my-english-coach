server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    # Lets Spring load apps/api/.env as simple KEY=value properties for local development.
    import: optional:file:.env[.properties]
  application:
    name: my-english-coach-api
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://db.upeqgcswpuuaaospierz.supabase.co:5432/postgres?sslmode=require}
    username: ${SUPABASE_DB_USERNAME:postgres}
    password: ${SUPABASE_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null

app:
  cors:
    allowed-origin: ${WEB_ORIGIN:http://localhost:5173}
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:openai/gpt-oss-120b}
    base-url: https://api.groq.com/openai/v1
